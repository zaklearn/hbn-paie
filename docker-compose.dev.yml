# HBN Paie — environnement de DEV uniquement (projet compose « hbn-paie-dev »).
# Aucun port publié ; réseau interne sans sortie ; limite 256 Mo par service ;
# arrêté après les tests (scripts/dev-test.sh). Ne touche à aucun autre projet du VPS.
name: hbn-paie-dev
services:
  ref:
    profiles: ["ref"]
    build: {context: ./docker, dockerfile: ref.Dockerfile, additional_contexts: {upstream: ./upstream}}
    image: hbn-paie-dev-ref:py3.12
    mem_limit: 256m
    network_mode: none
    volumes: ["./upstream:/upstream:ro"]

  test:
    build: {context: ./backend, dockerfile: ../docker/test.Dockerfile}
    image: hbn-paie-dev-test:py3.12
    mem_limit: 256m
    networks: [dev]
    environment:
      PAIE_ENV: test
      PAIE_TEST_DB_URL: "mysql+pymysql://root:${PAIE_DEV_DB_ROOT_PASSWORD:-}@mysql:3306/paie_test"
      PAIE_REFERENCE_XLSX: ${PAIE_REFERENCE_XLSX:-}
    volumes: [".:/work:ro"]
    depends_on:
      mysql: {condition: service_healthy}
    command: ["python", "-m", "pytest", "-q"]

  mysql:
    image: mysql:8.4
    mem_limit: 256m
    networks: [dev]
    environment:
      MYSQL_ROOT_PASSWORD: ${PAIE_DEV_DB_ROOT_PASSWORD:?mot de passe de dev requis (scripts/dev-test.sh le génère)}
      MYSQL_DATABASE: paie_test
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=30
      - --skip-name-resolve
      # dev seulement : datadir sur tmpfs (compté dans la mémoire du conteneur) -> redo minimal
      - --innodb-redo-log-capacity=8M
      - --innodb-log-buffer-size=4M
      - --temptable-max-ram=16M
    tmpfs: ["/var/lib/mysql:size=512m"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    profiles: ["e2e"]
    image: hbn-paie-dev-test:py3.12
    mem_limit: 256m
    networks: [dev]
    environment:
      PAIE_DB_URL: "mysql+pymysql://root:${PAIE_DEV_DB_ROOT_PASSWORD:-}@mysql:3306/paie_e2e?charset=utf8mb4"
      PAIE_COOKIE_SECURE: "false"         # HTTP interne au réseau de dev uniquement
      PAIE_STATIC_DIR: /work/frontend/dist
      E2E_SERVER_URL: "mysql+pymysql://root:${PAIE_DEV_DB_ROOT_PASSWORD:-}@mysql:3306/"
      E2E_ADMIN_PW: ${E2E_ADMIN_PW:-}
      E2E_USER_PW: ${E2E_USER_PW:-}
    volumes: [".:/work:ro"]
    depends_on:
      mysql: {condition: service_healthy}
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      retries: 40

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    mem_limit: 1g                          # Chromium : 256 Mo ne suffisent pas (signalé au rapport S4)
    networks: [dev]
    working_dir: /work/frontend
    environment:
      E2E_BASE_URL: http://api:8000
      E2E_ADMIN_PW: ${E2E_ADMIN_PW:-}
      E2E_USER_PW: ${E2E_USER_PW:-}
      E2E_CAPTURES: /captures
      HOME: /tmp
    volumes: [".:/work:ro", "./docs/sprints/S4_captures:/captures"]
    depends_on:
      api: {condition: service_healthy}
    command: ["npx", "playwright", "test", "--output=/tmp/test-results"]

networks:
  dev:
    internal: true
